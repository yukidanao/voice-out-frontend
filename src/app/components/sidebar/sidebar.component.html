<aside
  class="fixed inset-y-0 left-0 z-40 hidden w-[268px] flex-col border-r border-white/[0.06] bg-ink-900/60 px-4 py-6 backdrop-blur-2xl lg:flex"
  aria-label="Sidebar"
>
  <a routerLink="/home" class="flex flex-col gap-2 px-2" aria-label="VoiceOut home">
    <img src="brand/voiceout.png" alt="VoiceOut" class="h-9 w-auto self-start" />
    <span class="text-[10px] font-medium uppercase tracking-[0.22em] text-slate-500">
      Anonymous wall
    </span>
  </a>

  <button type="button" class="btn-primary mt-7 w-full" (click)="openWrite()">
    <app-icon name="pen" [size]="17" />
    Write a note
  </button>

  <nav class="mt-8 space-y-1" aria-label="Main navigation">
    <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-600">Menu</p>

    @for (item of nav; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        class="nav-link group"
      >
        <app-icon [name]="item.icon" [size]="18" />
        <span>{{ item.label }}</span>
        <app-icon
          name="chevron-right"
          [size]="14"
          class="ml-auto opacity-0 transition-opacity duration-300 group-hover:opacity-50"
        />
      </a>
    }
  </nav>

  <div class="mt-auto space-y-4 pt-8">
    <div class="card p-4">
      <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">
        <span class="live-dot"></span>
        Creator's note
      </div>
      <p class="mt-2.5 text-[12.5px] leading-relaxed text-slate-300">
        Write what you feel — anonymously. Be kind with what you share; all negative posts are removed.
      </p>
      <p class="mt-3 inline-flex items-center gap-1.5 text-[11px] text-slate-500">
        <app-icon name="heart" [size]="12" class="text-rose-400/80" />
        made with care
      </p>
    </div>
    <p class="px-2 text-[10.5px] text-slate-600">© {{ year }} VoiceOut</p>
  </div>
</aside>

<!-- Mobile top bar -->
<header
  class="fixed inset-x-0 top-0 z-40 border-b border-white/[0.06] bg-ink-950/70 backdrop-blur-2xl lg:hidden"
>
  <div class="flex h-16 items-center justify-between px-4">
    <a routerLink="/home" class="flex items-center gap-2.5" aria-label="VoiceOut home">
      <img src="brand/voiceout.png" alt="VoiceOut" class="h-7 w-auto" />
    </a>

    <div class="flex items-center gap-2">
      <span class="eyebrow !px-2.5 !py-1 !tracking-normal !normal-case">
        <span class="live-dot"></span>
        Live
      </span>
      <button
        type="button"
        class="btn-icon !h-9 !w-9"
        (click)="openWrite()"
        aria-label="Write a note"
      >
        <app-icon name="pen" [size]="16" />
      </button>
    </div>
  </div>
</header>

<!-- Mobile bottom navigation -->
<nav class="fixed inset-x-0 bottom-0 z-40 lg:hidden" aria-label="Mobile navigation">
  <div class="mx-auto max-w-md px-3 pb-[max(0.6rem,env(safe-area-inset-bottom))]">
    <div
      class="flex items-end justify-between gap-1 rounded-2xl border border-white/10 bg-ink-900/90 px-2 py-2 shadow-2xl backdrop-blur-2xl"
    >
      <a routerLink="/home" routerLinkActive="is-active" class="mobile-nav-link">
        <app-icon name="home" [size]="19" />
        <span>Home</span>
      </a>
      <a routerLink="/voices" routerLinkActive="is-active" class="mobile-nav-link">
        <app-icon name="waveform" [size]="19" />
        <span>Voices</span>
      </a>

      <button
        type="button"
        class="-mt-7 grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-accent-500 to-violet-500 text-white shadow-glow ring-4 ring-ink-950/80 transition duration-300 ease-spring hover:brightness-110 active:scale-95"
        (click)="openWrite()"
        aria-label="Write a note"
      >
        <app-icon name="plus" [size]="22" />
      </button>

      <a routerLink="/feedback" routerLinkActive="is-active" class="mobile-nav-link">
        <app-icon name="mail" [size]="19" />
        <span>Feedback</span>
      </a>
      <a routerLink="/about" routerLinkActive="is-active" class="mobile-nav-link">
        <app-icon name="info" [size]="19" />
        <span>About</span>
      </a>
    </div>
  </div>
</nav>
